<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEMPERA - Private Trip & Shuttle Bandung</title>
  
  <!-- CDN External -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Hubungkan CSS Terpisah -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 antialiased pb-12 transition-colors duration-300">

  <!-- Navigation Bar -->
  <nav class="bg-slate-900/90 backdrop-blur-md text-white px-4 py-3 sticky top-0 z-50 border-b border-slate-800">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <!-- Logo Tempat Kamu Upload di assets/logo/logo.png -->
      <div class="flex items-center gap-2">
        <img src="assets/logo/logo.png" alt="TEMPERA Logo" class="h-8 w-auto error-fallback" onerror="this.style.display='none'">
        <span class="font-bold text-lg tracking-wider text-indigo-400">TEMPERA</span>
      </div>

      <!-- Tombol Pilihan Bahasa & Tema Mode Gelap -->
      <div class="flex items-center gap-3">
        <div class="text-xs border border-slate-700 px-2 py-1 rounded-md flex items-center gap-1">
          <span>🇮🇩</span> ID
        </div>
        
        <!-- TOMBOL TEMA DENGAN ID theme-toggle -->
        <button id="theme-toggle" type="button" class="p-2 rounded-full border border-slate-700 hover:bg-slate-800 transition text-yellow-400 flex items-center justify-center w-8 h-8">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero Section dengan Background -->
  <header class="relative bg-slate-900 text-white py-12 px-4 text-center overflow-hidden">
    <div class="max-w-xl mx-auto relative z-10 space-y-3">
      <p class="text-xs uppercase font-semibold text-indigo-400 tracking-widest">Teman Perjalanan Anda</p>
      <h1 class="text-3xl md:text-4xl font-extrabold">TEMPERA Private Trip Bandung</h1>
      <p class="text-xs md:text-sm text-gray-300">Lembang • Ciwidey • Pangalengan • Dago</p>
      
      <!-- Live Weather Widget -->
      <div class="inline-flex items-center gap-3 bg-white/10 backdrop-blur-md px-4 py-2 rounded-xl border border-white/10 mt-2">
        <div id="weather-icon" class="text-yellow-400 text-xl">
          <i class="fa-solid fa-sun"></i>
        </div>
        <div class="text-left">
          <div class="text-[10px] text-gray-300 uppercase tracking-wider" id="weather-location">Bandung</div>
          <div class="text-sm font-bold leading-none" id="weather-temp">--°C</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Form -->
  <main class="max-w-xl mx-auto px-4 -mt-6 relative z-20">
    <form id="bookingForm" class="bg-white rounded-2xl shadow-xl p-5 space-y-5 border border-gray-100">
      
      <!-- Rute -->
      <div>
        <h2 class="text-sm font-bold text-gray-800 flex items-center gap-2 border-b border-gray-100 pb-2 mb-3">
          <i class="fa-solid fa-map-location-dot text-indigo-600"></i> Rute Perjalanan
        </h2>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Lokasi Penjemputan</label>
            <input type="text" id="pickup" required placeholder="Contoh: Stasiun Bandung / Hotel" class="custom-input">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Destinasi / Tujuan</label>
            <select id="destination" class="custom-input bg-white">
              <option value="Bandung Kota">Bandung Kota (Area Reguler)</option>
              <option value="Lembang">Lembang (Area Luar 1)</option>
              <option value="Ciwidey">Ciwidey (Area Luar 2)</option>
              <option value="Pangalengan">Pangalengan (Area Luar 2)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Armada & Kapasitas -->
      <div>
        <h2 class="text-sm font-bold text-gray-800 flex items-center gap-2 border-b border-gray-100 pb-2 mb-3">
          <i class="fa-solid fa-car text-indigo-600"></i> Pilih Armada
        </h2>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Jumlah Penumpang</label>
            <input type="number" id="passengers" min="1" max="15" value="1" required class="custom-input">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Paket Layanan</label>
            <select id="vehicleType" class="custom-input bg-white">
              <option value="regular">Shuttle Reguler (Per Kursi - Rp 80.000)</option>
              <option value="private">Private Car / Drop Off (Maks 4 Orang - Rp 350.000)</option>
              <option value="hiace">HiAce / Elf Charter (Maks 14 Orang - Rp 900.000)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Ringkasan Biaya & Tombol WA -->
      <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 flex items-center justify-between">
        <div>
          <span class="text-[10px] font-semibold text-gray-500 uppercase block">Estimasi Biaya</span>
          <span id="totalPrice" class="text-lg font-extrabold text-indigo-600">Rp 80.000</span>
        </div>
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2">
          <i class="fa-brands fa-whatsapp text-sm"></i> Pesan Sekarang
        </button>
      </div>

    </form>
  </main>

  <!-- Hubungkan File JavaScript Terpisah -->
  <script src="script.js"></script>
</body>
</html>
